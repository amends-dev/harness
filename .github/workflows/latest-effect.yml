name: Latest Effect

# Checks the repository against the newest Effect release the packages allow, every week, as a new
# project that installs them gets it: the catalog's Effect packages move to that release, then the
# types, the tests, and the distributions are checked. Effect has changed an API within a minor
# release before, as Crypto's randomUUIDv4 in 4.0.3, and this finds such a change before the
# packages' users do. Upgrade as CONTRIBUTING.md describes.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check against the newest Effect
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Move the catalog's Effect packages to the newest release
        run: |
          current=$(bun -e 'console.log((await Bun.file("package.json").json()).workspaces.catalog.effect)')
          version=$(npm view "effect@^$current" version --json | jq -r 'if type == "array" then .[] else . end' | sort -V | tail -1)
          echo "Checking against effect@$version, the newest within ^$current"
          bun -e '
            const manifest = await Bun.file("package.json").json()
            for (const name of Object.keys(manifest.workspaces.catalog)) {
              if (name === "effect" || name.startsWith("@effect/")) manifest.workspaces.catalog[name] = process.argv[1]
            }
            await Bun.write("package.json", JSON.stringify(manifest, null, 2) + "\n")
          ' "$version"
      - name: Install dependencies
        run: bun install
      - name: Type check
        run: bun run typecheck
      - name: Test
        run: bun run test --maxWorkers=2
      - name: Check the distributions
        run: bun run dist check
