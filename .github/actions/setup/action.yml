name: Set up the workspace
description: Install the pinned Bun and the locked dependencies, reusing Bun's package cache.
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    # Packages download once per lockfile; installing from the cache takes seconds.
    - uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-
    # `prepare` patches TypeScript with the Effect diagnostics that type checking relies on.
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
